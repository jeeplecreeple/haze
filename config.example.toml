# Haze configuration. Every key is optional; anything left out uses the default shown here.

[spotify]
# Client ID of your own app from https://developer.spotify.com/dashboard
client_id = ""
# Must be registered on that app exactly as written.
redirect_uri = "http://127.0.0.1:8898/login"

[updates]
check = true              # look for a new release on GitHub at startup

[playback]
bitrate = "high"          # low (96 kbps) | normal (160) | high (320)
volume = 70               # 0-100
normalisation = true
gapless = true
audio_cache_mb = 0        # keep this much audio on disk for replays; 0 = off

[appearance]
# haze | spotify | apple-music | apple-music-dark | nord | gruvbox | catppuccin | dracula | light,
# or the name of a theme file in the "themes" folder next to this file (see the guide)
theme = "haze"
font_size = 14.0
font_family = ""          # empty = the built-in Inter; "system" = your system font; or any installed font / one in the "fonts" folder
font_files = []           # extra .ttf/.otf files to load from anywhere
app_icon = ""             # haze (empty), sunset, ocean, mint, midnight, mono, aurora, ember, or a PNG/JPG file
accent_from_cover = false # tint the accent colour from the playing song's cover art
ambient_background = true # a blurred glow of the playing song's cover behind the whole window
corner_radius = 8.0
panel_opacity = 78.0      # % how solid the panels are over the cover glow (40-100)
glow_strength = 55.0      # % of the cover's colour the glow keeps (10-100)
panel_edges = true        # a hairline edge around the panels
show_album_art = true
compact = false           # denser track rows
window_width = 1100.0
window_height = 720.0
renderer = "cpu"          # cpu = lowest memory; gpu = wgpu (Vulkan/Metal/DirectX)

# Hex colours that override the theme. Empty = use the theme's colour.
[appearance.colors]
background = ""
surface = ""
text = ""
muted_text = ""
accent = ""               # e.g. "#1db954"
danger = ""

[layout]
show_sidebar = true
sidebar_icons_only = false  # only icons and playlist covers, names on hover
sidebar = "left"          # left | right
sidebar_width = 220.0
player_bar = "bottom"     # top | bottom
show_side_panel = true    # the up-next queue
side_panel = "right"      # left | right
side_panel_width = 300.0
track_columns = ["title", "artist", "album", "duration"]   # any order, any subset
gap = 8.0                 # space between panels
padding = 24.0            # space around the page

# The Now Playing page (Settings > Player has all of this, plus ready-made looks).
[player]
layout = "split"          # split (player and lyrics) | centered | compact (small player above lyrics)
lyrics_side = "right"     # left | right
lyrics_card = true        # the current line sits on a soft card
full_window = true        # hide the sidebar, queue and player bar on this page
background = "blur"       # blur | glow | theme
cover_shape = "cookie"    # cookie | circle | flower | burst | hexagon | squircle | rounded | square
cover_size = 0.0          # pixels; 0 = fit the window
spin = false              # turn the cover slowly, like a record
spin_speed = 4.0          # turns a minute
wave_depth = 45.0         # 0-100, how deep the cookie and flower edges go
wave_count = 12           # bumps around the edge
pulse = 0.0               # 0-100, how much the cover grows on each beat
cover_border = 0.0        # pixels; an edge around the cover in the visualizer's colour
visualizer = "ring"       # ring | ring_wave | dots | spikes | bars | wave | off
visualizer_color = "accent"  # accent | cover | rainbow | gradient | text | custom
visualizer_custom = ""    # hex colour for "custom", and where "gradient" starts (empty = accent)
visualizer_custom_end = ""  # where "gradient" ends (empty = the cover's colour)
visualizer_bars = 72
visualizer_height = 22.0  # how far the bars reach, % of the cover
visualizer_sensitivity = 100.0
visualizer_smoothing = 60.0  # 0 = jumpy, 95 = very smooth
visualizer_mirror = true  # lows at the bottom on both sides
visualizer_glow = true
bar_width = 4.0
fps = 30                  # redraws a second while it moves; lower uses less CPU
play_shape = "cookie"     # same shapes as the cover
play_size = 64.0
play_spin = true
control_size = 20.0
progress = "wave"         # wave | line | thick | dots | ring (around the cover) | hidden
show_times = true
show_volume = true
show_shuffle_repeat = true
show_album = true
show_extras = false       # buttons for the queue, DJ and lyrics
title_size = 26.0
align = "center"          # center | left

# Plugins switched on, by folder name in the "plugins" folder. Settings > Plugins manages this.
[plugins]
enabled = []

[lyrics]
sources = ["spotify", "lrclib"]   # tried in order; lrclib = lrclib.net, a free community database
word_highlight = true     # light up each word as it's sung
blurred_background = true # blurred cover art behind the lyrics
font_size = 34.0
font_family = ""          # empty = the built-in Inter Display ExtraBold
align = "left"            # left | center
offset_ms = 0             # negative = earlier, positive = later
lines_before = 2          # past lines kept on screen
background_strength = 50.0  # % of the cover's colour the blurred background keeps
other_lines = 100.0       # % brightness of the lines that aren't being sung (30-200)

# Your own playlist covers, by playlist id ("liked" for Liked Songs). Easiest to set from the app.
[covers]

[dj]
provider = "openai"       # openai | anthropic | gemini | mistral | groq | openrouter | deepseek | xai | cerebras | ollama
model = ""                # empty = the provider's default (gpt-4o-mini, mistral-small-latest, openrouter/free...)
# Empty = the provider's own address. Set it to point "openai" at any other compatible API,
# for example LM Studio at http://localhost:1234/v1 (no key needed).
base_url = ""
api_key = ""              # stored in plain text here; api_key_env is the safer option
api_key_env = ""          # empty = the usual one, e.g. OPENAI_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY
mode = "talk"             # queue = only pick songs | talk = text intros | voice = spoken intros
name = "Haz DJ"
persona = "Warm, upbeat late-night radio host. Knows music history and loves a good segue."
batch_size = 5            # songs per set
refill_at = 1             # top up when this many songs are left
talk_every = 2            # intro before every Nth DJ song
max_words = 45
discovery = 40            # 0 = favourites only, 100 = all new
allow_explicit = true
language = "English"
temperature = 0.9         # OpenAI-compatible and Gemini only

[dj.tts]
engine = "system"         # system = OS voice | piper = natural offline voice | openai = OpenAI-compatible /audio/speech
voice = ""                # system: an OS voice name; piper: a .onnx voice file (empty = downloaded English voice); openai: alloy, nova...
piper_path = ""           # empty = find piper-tts or piper by itself
model = "gpt-4o-mini-tts"
base_url = ""             # empty = the DJ's OpenAI-compatible URL, else api.openai.com
api_key_env = ""          # empty = the DJ's key (openai provider) or OPENAI_API_KEY
duck_to = 25              # music volume % while the DJ talks; 0 pauses instead

# Easiest to change in Settings > Shortcuts. Empty = no shortcut.
# Keys: a character or space, enter, escape, tab, left, right, up, down, backspace, delete, home,
# end, pageup, pagedown, f1-f12.
# Modifiers: ctrl (also Cmd on macOS), shift, alt. Media keys always work.
[keys]
play_pause = "ctrl+space"
next = "ctrl+right"
previous = "ctrl+left"
volume_up = "ctrl+up"
volume_down = "ctrl+down"
seek_forward = "shift+right"
seek_back = "shift+left"
search = "ctrl+f"
toggle_side_panel = "ctrl+b"
dj_now = "ctrl+d"
lyrics = "ctrl+l"
now_playing = "ctrl+p"
fullscreen = "f11"
