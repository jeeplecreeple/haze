name: build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: ubuntu-22.04-arm
            name: linux-arm64
          - os: macos-14
            name: macos-arm64
          # Intel Macs: cross-compiled on Apple Silicon, since Intel runners are being retired.
          - os: macos-14
            name: macos-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Test
        if: matrix.target == ''
        run: cargo test --locked
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }}
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/haze target/release/haze
          else
            cargo build --release --locked
          fi

      # Ubuntu 22.04 is used on purpose: binaries built against its older glibc
      # also run on newer Debian, Ubuntu, Fedora and Arch.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/haze
          cp target/release/haze README.md GUIDE.md LICENSE config.example.toml packaging/linux/haze.desktop dist/haze/
          cp assets/icon.png dist/haze/haze.png
          tar -C dist -czf haze-${{ matrix.name }}.tar.gz haze
          cargo install cargo-deb --locked
          cargo deb --no-build --output haze-${{ matrix.name }}.deb

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=dist/Haze.app/Contents
          mkdir -p "$app/MacOS"
          cp target/release/haze "$app/MacOS/haze"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          sed "s/@VERSION@/$version/g" packaging/macos/Info.plist > "$app/Info.plist"
          mkdir -p "$app/Resources" haze.iconset
          for s in 16 32 128 256; do
            sips -z $s $s assets/icon.png --out haze.iconset/icon_${s}x${s}.png
            if [ $((s * 2)) -le 256 ]; then
              sips -z $((s * 2)) $((s * 2)) assets/icon.png --out haze.iconset/icon_${s}x${s}@2x.png
            fi
          done
          iconutil -c icns haze.iconset -o "$app/Resources/haze.icns"
          # Ad-hoc signature so Apple Silicon will run it; it is not notarized.
          codesign --force --deep --sign - dist/Haze.app
          cp README.md GUIDE.md LICENSE config.example.toml dist/
          ditto -c -k --keepParent dist haze-${{ matrix.name }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/haze | Out-Null
          Copy-Item target/release/haze.exe, README.md, GUIDE.md, LICENSE, config.example.toml dist/haze/
          Compress-Archive -Path dist/haze -DestinationPath haze-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: haze-${{ matrix.name }}
          path: |
            haze-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Downloads for every platform are below. See GUIDE.md for install steps.

            **macOS and Windows builds are not tested yet.** They compile in CI, but nobody
            has played music with them so far. If you try one, please open an issue saying
            whether it worked, even if it did.
